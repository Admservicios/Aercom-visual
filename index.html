<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aercom</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
  --accent:#2f7cff;
  --bg:#0f172a;
  --text:#ffffff;
  --muted:#cbd5f5;
}

/* BASE */
body{
  margin:0;
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HERO */
.hero{
  height:100vh;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  background:url("img/inicio.jpeg") center/cover no-repeat;
}

/* 👇 overlay corregido */
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.55));
}

/* CONTENIDO */
.hero-content{
  position:relative;
  max-width:700px;
  padding:20px;
}

/* TITULO */
.hero h1{
  font-family:'Rajdhani',sans-serif;
  font-size:56px;
  margin-bottom:10px;
  letter-spacing:1px;
}

/* SUB */
.hero-sub{
  font-size:18px;
  color:var(--muted);
  margin-bottom:30px;
}

/* CTA */
.btn{
  background:var(--accent);
  border:none;
  padding:14px 30px;
  border-radius:12px;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  transition:.25s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(47,124,255,.4);
}

/* CONTINUAR */
.continuar{
  margin-top:40px;
  color:var(--accent);
  font-size:14px;
  opacity:1;
}

/* RESPONSIVE */
@media(max-width:600px){
  .hero h1{
    font-size:36px;
  }
}

</style>
</head>

<body>

<section class="hero">

  <div class="hero-content">
    
    <div style="color:#3b82f6; font-size:12px; letter-spacing:3px; margin-bottom:10px;">
      DIVISIÓN AIRE COMPRIMIDO
    </div>

    <h1>Compresores de Aire</h1>

    <p class="hero-sub">
      ¿Tu línea de aire está preparada para evitar paradas críticas?
    </p>

    <button class="btn">Explorar</button>

    <div class="continuar">CONTINUAR ↓</div>

  </div>

</section>

</body>
</html>
