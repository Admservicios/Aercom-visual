<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aercom - Soluciones Industriales</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --accent: #007aff;
            --glass: rgba(15, 15, 15, 0.9);
            --border: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Contenedor Principal Flexible */
        .app-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            padding: 20px;
            background-size: cover;
            background-position: center;
        }

        .slide.active { display: flex; }

        /* GRID DEL MENU - Corregido para que no se rompa */
        .grid-selector { 
            display: flex;
            gap: 20px;
            width: 100%;
            height: 100%;
            padding: 40px;
            justify-content: center;
            align-items: center;
        }

        .card { 
            flex: 1;
            height: 80%;
            max-width: 350px;
            position: relative; 
            border-radius: 20px; 
            overflow: hidden; 
            border: 1px solid var(--border); 
            background: #111;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* Para que la foto del equipo se vea completa */
            background: #000;
            padding: 15px;
        }
        
        .card-info { 
            background: #000;
            padding: 15px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            border-top: 1px solid var(--border);
        }

        /* CUADROS DE TEXTO - Mejor contraste */
        .glass-card {
            margin: auto;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 25px;
            width: 90%;
            max-width: 700px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        h2 { font-size: clamp(30px, 5vw, 50px); font-weight: 900; margin-bottom: 20px; }
        
        .challenge-item { 
            display: flex; align-items: center; gap: 15px; 
            font-size: 18px; padding: 12px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            text-align: left;
        }

        /* FLECHA CENTRADA */
        .btn-next {
            background: none;
            border: none;
            color: #fff;
            margin-top: 25px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .btn-next i { font-size: 40px; color: var(--accent); }

        .btn-back {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: #222; border: 1px solid var(--border);
            color: #fff; padding: 10px 15px; border-radius: 10px;
        }

    </style>
</head>
<body>

    <div class="app-container">

        <div class="slide active" id="selector">
            <div class="grid-selector">
                <div class="card" onclick="nav('ge-intro')">
                    <img src="./grupoelectrogeno.jpeg">
                    <div class="card-info">GRUPOS ELECTRÓGENOS</div>
                </div>
                <div class="card">
                    <img src="./Electrocompresor.jpg">
                    <div class="card-info">COMPRESORES DE AIRE</div>
                </div>
                <div class="card">
                    <img src="./todoslosequipo.jpg">
                    <div class="card-info">TODOS LOS EQUIPOS</div>
                </div>
            </div>
        </div>

        <div class="slide" id="ge-intro" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('./grupoelectrogeno.jpeg');">
            <button class="btn-back" onclick="nav('selector')">VOLVER</button>
            <div class="glass-card">
                <p style="color:var(--accent); font-weight:700; letter-spacing:3px; margin-bottom:10px;">AERCOM ENERGÍA</p>
                <h2>GRUPO ELECTRÓGENO</h2>
                <p style="font-size:20px; opacity:0.8;">¿Su operación está preparada para evitar paradas críticas?</p>
                <button class="btn-next" onclick="nav('diagnostico')">
                    <i class="fa-solid fa-chevron-down"></i>
                    <span style="font-size:10px; letter-spacing:2px; margin-top:5px;">DESAFÍOS</span>
                </button>
            </div>
        </div>

        <div class="slide" id="diagnostico" style="background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('./grupoelectrogeno.jpeg');">
            <button class="btn-back" onclick="nav('ge-intro')">VOLVER</button>
            <div class="glass-card">
                <h2 style="font-size: 30px; text-align: left; margin-bottom: 30px;">Desafíos Operativos</h2>
                <div class="challenge-item"><i class="fa-solid fa-bolt" style="color:var(--accent)"></i> Cortes de energía frecuentes</div>
                <div class="challenge-item"><i class="fa-solid fa-triangle-exclamation" style="color:var(--accent)"></i> Falta de respaldo confiable</div>
                <div class="challenge-item"><i class="fa-solid fa-industry" style="color:var(--accent)"></i> Necesidad de operación continua</div>
                <div class="challenge-item"><i class="fa-solid fa-chart-line" style="color:var(--accent)"></i> Picos de demanda energética</div>
                
                <button class="btn-next" onclick="nav('explorador')">
                    <i class="fa-solid fa-chevron-down"></i>
                    <span style="font-size:10px; letter-spacing:2px;">SOLUCIÓN TÉCNICA</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        function nav(id) {
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(id);
            if(target) target.classList.add('active');
        }
    </script>
</body>
</html>
