<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aercom - Experiencia Profesional</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

        :root {
            --accent: #007aff;
            --bg: #000;
            --glass: rgba(0, 0, 0, 0.85); /* Más oscuro para mejor contraste */
            --border: rgba(255, 255, 255, 0.2);
            --text-dim: rgba(255, 255, 255, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 1280px;
            height: 100%;
            max-height: 720px;
            position: relative;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background-size: cover;
            background-position: center;
        }

        .slide.active { display: flex; }

        /* Tarjetas de Cristal */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 45px;
            border-radius: 28px;
            width: 90%;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center; /* Centra todo el contenido internamente */
        }

        h2 { font-size: 48px; font-weight: 800; margin-bottom: 15px; color: #fff; letter-spacing: -1px; }
        .sub-text { font-size: 22px; color: var(--text-dim); font-weight: 300; margin-bottom: 30px; }

        /* Botón de navegación (Flecha) */
        .nav-down {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            transition: 0.3s;
        }
        .nav-down:active { transform: translateY(5px); opacity: 0.7; }
        .nav-down i { font-size: 32px; margin-bottom: 8px; }
        .nav-down span { font-size: 10px; letter-spacing: 3px; font-weight: 700; color: var(--accent); }

        /* Grid de Equipos Ajustado */
        .grid-selector { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px; 
            width: 100%; 
            height: 80%; 
            padding: 40px; 
        }
        .card { 
            position: relative; 
            border-radius: 24px; 
            overflow: hidden; 
            border: 1px solid var(--border); 
            background: #0a0a0a;
            cursor: pointer;
        }
        .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* Ajusta la imagen sin cortarla */
            padding: 20px;
            opacity: 0.8; 
            transition: 0.4s; 
        }
        .card:active img { transform: scale(1.05); opacity: 1; }
        
        .card-info { 
            position: absolute; bottom: 0; width: 100%; 
            padding: 20px; background: linear-gradient(transparent, #000); 
            text-align: center; font-weight: 700;
        }

        /* Desafíos con mejor contraste */
        .challenge-list { width: 100%; text-align: left; margin-bottom: 20px; }
        .challenge-item { 
            display: flex; align-items: center; gap: 20px; 
            font-size: 20px; padding: 18px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            color: #fff;
        }
        .challenge-item i { color: var(--accent); font-size: 22px; filter: drop-shadow(0 0 5px var(--accent)); }

        .btn-back {
            position: absolute; top: 30px; left: 30px; z-index: 100;
            background: rgba(255,255,255,0.1); border: 1px solid var(--border);
            color: #fff; padding: 10px 20px; border-radius: 50px; cursor: pointer;
            font-size: 12px; font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <div class="slide active" id="selector" style="background: #000;">
            <div class="grid-selector">
                <div class="card" onclick="nav('ge-intro')">
                    <img src="./grupoelectrogeno.jpeg">
                    <div class="card-info">GRUPOS ELECTRÓGENOS</div>
                </div>
                <div class="card">
                    <img src="./Electrocompresor.jpg">
                    <div class="card-info">COMPRESORES DE AIRE</div>
                </div>
                <div class="card">
                    <img src="./todoslosequipo.jpg">
                    <div class="card-info">TODOS LOS EQUIPOS</div>
                </div>
            </div>
        </div>

        <div class="slide" id="ge-intro" style="background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.7)), url('./grupoelectrogeno.jpeg');">
            <button class="btn-back" onclick="nav('selector')">VOLVER</button>
            <div class="glass-card">
                <p style="color: var(--accent); font-weight: 900; font-size: 13px; letter-spacing: 5px; margin-bottom: 15px;">DIVISIÓN ENERGÍA</p>
                <h2>GRUPO ELECTRÓGENO</h2>
                <p class="sub-text">¿Su operación está preparada para evitar paradas críticas?</p>
                
                <button class="nav-down" onclick="nav('diagnostico')">
                    <i class="fa-solid fa-caret-down"></i>
                    <span>DESCUBRIR DESAFÍOS</span>
                </button>
            </div>
        </div>

        <div class="slide" id="diagnostico" style="background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)), url('./grupoelectrogeno.jpeg');">
            <button class="btn-back" onclick="nav('ge-intro')">VOLVER</button>
            <div class="glass-card">
                <h2 style="font-size: 36px; align-self: flex-start;">Desafíos Operativos</h2>
                <div class="challenge-list">
                    <div class="challenge-item"><i class="fa-solid fa-bolt-lightning"></i> Cortes de energía frecuentes</div>
                    <div class="challenge-item"><i class="fa-solid fa-triangle-exclamation"></i> Falta de respaldo confiable</div>
                    <div class="challenge-item"><i class="fa-solid fa-infinity"></i> Necesidad de operación continua</div>
                    <div class="challenge-item"><i class="fa-solid fa-chart-line"></i> Picos de demanda energética</div>
                </div>
                
                <button class="nav-down" onclick="nav('explorador')">
                    <i class="fa-solid fa-caret-down"></i>
                    <span>VER SOLUCIÓN TÉCNICA</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        function nav(id) {
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
