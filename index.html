<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aercom</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
  --accent:#2f7cff;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
}

/* BASE */
body{
  margin:0;
  font-family:'DM Sans',sans-serif;
  background:linear-gradient(180deg,#eaf2ff,#f8fafc);
  color:var(--text);
}

/* PANTALLAS */
.screen{
  display:none;
  min-height:100vh;
  padding:20px;
}
.active{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  animation:fade .3s ease;
}
@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1}
}

/* TITULOS */
h1,h2,h3{
  font-family:'Rajdhani',sans-serif;
  text-align:center;
}

p{
  text-align:center;
  color:var(--muted);
}

/* BOTONES */
button{
  padding:14px 30px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:#fff;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}
button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(47,124,255,.3);
}

/* BACK */
.back{
  position:fixed;
  top:15px;
  left:15px;
  background:#fff;
  border:1px solid #e2e8f0;
  color:#0f172a;
}

/* HERO */
.hero{
  height:100vh;
  width:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:url("img/inicio.jpeg") center/cover no-repeat;
  position:relative;
}
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.75);
}
.hero *{
  position:relative;
}

/* TARJETAS MENU */
.card{
  width:100%;
  max-width:700px;
  height:230px;
  border-radius:18px;
  overflow:hidden;
  margin:15px 0;
  position:relative;
  cursor:pointer;
  background:#fff;
  border:1px solid #e2e8f0;
  transition:.25s;
}
.card:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 35px rgba(0,0,0,.1);
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay{
  position:absolute;
  bottom:0;
  width:100%;
  padding:18px;
  font-size:20px;
  font-weight:600;
  background:linear-gradient(transparent,rgba(0,0,0,.6));
  color:#fff;
  text-align:center;
}

/* DETALLE */
.detalle-img{
  width:100%;
  max-width:700px;
  height:260px;
  object-fit:cover;
  border-radius:18px;
  margin:15px 0;
}

.block{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin:10px 0;
  border-left:4px solid var(--accent);
}

/* RESPONSIVE */
@media(max-width:600px){
  .card{height:180px}
}

</style>
</head>

<body>

<!-- INICIO -->
<div id="inicio" class="screen active">
  <div class="hero">
    <h1>AERCOM</h1>
    <p>Soluciones en energía y aire comprimido</p>
    <button onclick="ir('menu')">Explorar</button>
  </div>
</div>

<!-- MENU -->
<div id="menu" class="screen">
  <button class="back" onclick="ir('inicio')">←</button>

  <h2>Seleccioná un equipo</h2>

  <div class="card" onclick="verEquipo('grupo')">
    <img src="img/grupoelectrogeno.jpeg">
    <div class="overlay">Grupo electrógeno</div>
  </div>

  <div class="card" onclick="verEquipo('moto')">
    <img src="img/moto.jpg">
    <div class="overlay">Motocompresor</div>
  </div>

  <div class="card" onclick="verEquipo('electro')">
    <img src="img/electro.jpg">
    <div class="overlay">Electrocompresor</div>
  </div>

  <div class="card" onclick="verEquipo('torre')">
    <img src="img/torre.jpg">
    <div class="overlay">Torre iluminación</div>
  </div>
</div>

<!-- DETALLE -->
<div id="detalle" class="screen">
  <button class="back" onclick="ir('menu')">←</button>

  <h2 id="titulo"></h2>
  <img id="imagen" class="detalle-img">
  <p id="descripcion"></p>

  <div id="contenido"></div>
</div>

<script>

function ir(p){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'))
  document.getElementById(p).classList.add('active')
}

function verEquipo(n){

let data={
grupo:{
titulo:"Grupo electrógeno",
img:"img/grupoelectrogeno.jpeg",
desc:"Equipos diseñados para garantizar suministro eléctrico continuo.",
problemas:["Sobrecalentamiento","Bajo rendimiento","Fallas eléctricas"],
soluciones:["Mantenimiento","Cambio de filtros","Diagnóstico completo"],
servicios:["Service","Repuestos","Control operativo"]
},

moto:{
titulo:"Motocompresor",
img:"img/moto.jpg",
desc:"Compresión de aire para industria.",
problemas:["Baja presión","Ruido"],
soluciones:["Ajuste","Revisión"],
servicios:["Mantenimiento","Control"]
},

electro:{
titulo:"Electrocompresor",
img:"img/electro.jpg",
desc:"Equipos eléctricos eficientes.",
problemas:["Paradas","Fallas"],
soluciones:["Diagnóstico","Reparación"],
servicios:["Service","Control"]
},

torre:{
titulo:"Torre iluminación",
img:"img/torre.jpg",
desc:"Iluminación para obras.",
problemas:["Falla luz"],
soluciones:["Cambio lámparas"],
servicios:["Mantenimiento"]
}
}

let eq=data[n]

titulo.innerText=eq.titulo
descripcion.innerText=eq.desc
imagen.src=eq.img

let cont=document.getElementById("contenido")
cont.innerHTML=""

function bloque(t,l){
let h=document.createElement("h3")
h.innerText=t
cont.appendChild(h)

l.forEach(i=>{
let d=document.createElement("div")
d.className="block"
d.innerText=i
cont.appendChild(d)
})
}

bloque("Problemas",eq.problemas)
bloque("Soluciones",eq.soluciones)
bloque("Servicios",eq.servicios)

ir("detalle")
}

</script>

</body>
</html>
